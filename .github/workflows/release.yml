name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build
        run: npm run check
      - name: Verify tag matches extension version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./apps/chrome-extension/manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $expected" >&2
            exit 1
          fi
      - name: Package extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist/chrome-extension
          zip -qr "../../release/lingvilibrist-${GITHUB_REF_NAME}-chrome.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --verify-tag
