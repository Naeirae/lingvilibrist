name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Scan public tree for private infrastructure markers
        shell: bash
        run: |
          set -euo pipefail
          forbidden='editorial-dispatcher|nekurismarieykjuri|DISPATCHER_API_KEY|Skillbox Media|skillbox-corrector'
          if grep -RniE "$forbidden" --exclude-dir=.git --exclude='ci.yml' .; then
            echo 'Private/internal marker found in public repository.' >&2
            exit 1
          fi
