name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status/**'
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build
        run: npm run check
      - name: Validate extension manifest
        run: node -e "const m=require('./dist/chrome-extension/manifest.json'); if(m.manifest_version!==3||m.name!=='Lingvilibrist') process.exit(1); console.log(m.name,m.version)"
      - name: Scan public tree for private infrastructure markers
        shell: bash
        run: |
          set -euo pipefail
          forbidden='editorial-dispatcher|nekurismarieykjuri|DISPATCHER_API_KEY|Skillbox Media|skillbox-corrector'
          if grep -RniE "$forbidden" --exclude-dir=.git --exclude='ci.yml' .; then
            echo 'Private/internal marker found in public repository.' >&2
            exit 1
          fi
      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: lingvilibrist-chrome-extension
          path: dist/chrome-extension
          if-no-files-found: error

  python-nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/nlp/pyproject.toml
      - name: Install local morphology package
        run: python -m pip install ./python/nlp pytest
      - name: Test local morphology package
        run: pytest -q python/nlp/tests
      - name: Smoke-test CLI
        shell: bash
        run: printf 'Это тестовый текст.' | lingvilibrist-nlp >/tmp/lingvilibrist-nlp.json && python -m json.tool /tmp/lingvilibrist-nlp.json >/dev/null

  provenance:
    if: always() && github.event_name == 'push' && github.ref_name == 'main'
    needs: [javascript, python-nlp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record CI outcome in repository
        shell: bash
        env:
          JS_RESULT: ${{ needs.javascript.result }}
          PY_RESULT: ${{ needs.python-nlp.result }}
        run: |
          set -euo pipefail
          mkdir -p build-status
          overall=failure
          if [[ "$JS_RESULT" == success && "$PY_RESULT" == success ]]; then overall=success; fi
          cat > build-status/ci-main.json <<EOF
          {
            "schema_version": 1,
            "source_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "javascript": "${JS_RESULT}",
            "python_nlp": "${PY_RESULT}",
            "overall": "${overall}",
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/ci-main.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public CI outcome'
            git push origin HEAD:main
          fi
          if [[ "$overall" != success ]]; then exit 1; fi
